name: Build and Push

on:
  push:
    branches: [dev, staging, prod]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY_NAME: ${{ secrets.ECR_REPOSITORY_NAME }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      env_name: ${{ steps.env.outputs.name }}
      sha_short: ${{ steps.sha.outputs.short }}
      ecr_repo_uri: ${{ steps.ecr.outputs.repo_uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" == "prod" ]; then
            echo "name=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" == "staging" ]; then
            echo "name=staging" >> $GITHUB_OUTPUT
          else
            echo "name=dev" >> $GITHUB_OUTPUT
          fi

      - name: Get SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve ECR repository URI
        id: ecr
        run: |
          URI=$(aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY_NAME}" \
            --query 'repositories[0].repositoryUri' \
            --output text)
          echo "repo_uri=$URI" >> "$GITHUB_OUTPUT"
          echo "ECR_REPO_URI=$URI" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.ECR_REPO_URI }}:${{ steps.env.outputs.name }}-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### Built: ${{ env.ECR_REPO_URI }}:${{ steps.env.outputs.name }}-${{ steps.sha.outputs.short }}" >> $GITHUB_STEP_SUMMARY

  update-helm:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: PaulAde-Dev/gitops-helm-chart
          token: ${{ secrets.HELM_REPO_PAT }}

      - name: Update image tag
        run: |
          ENV_NAME="${{ needs.build.outputs.env_name }}"
          SHORT_SHA="${{ needs.build.outputs.sha_short }}"
          ECR_REPO_URI="${{ needs.build.outputs.ecr_repo_uri }}"

          # Keep the chart in sync with the latest image location and version.
          sed -i "s|^[[:space:]]*repository:.*$|  repository: ${ECR_REPO_URI}|" charts/sample-app/values-${ENV_NAME}.yaml
          sed -i "s|^[[:space:]]*tag:.*$|  tag: \"${ENV_NAME}-${SHORT_SHA}\"|" charts/sample-app/values-${ENV_NAME}.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Update image tag to ${{ github.ref_name }}-$(echo ${{ github.sha }} | cut -c1-7)"
          git push